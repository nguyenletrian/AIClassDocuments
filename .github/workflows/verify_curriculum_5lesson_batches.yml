name: Verify 5-lesson curriculum batches

on:
  pull_request:
    paths:
      - "lessons/chapters/**"
      - "docs/CURRICULUM-5-LESSON-PROGRESS.json"
      - "docs/BRIDGE-FIVE-LESSON-BATCHES.md"
      - "docs/CURRICULUM-STYLE-GUIDE.md"
      - "AGENTS.md"
      - "bridgeTask.json"
      - "tests/test_curriculum_structure.py"
      - "tests/test_curriculum_five_lesson_batches.py"
      - "tests/test_curriculum_batch_01_scenarios.py"
      - "tests/test_curriculum_batch_02_scenarios.py"
      - "tests/test_curriculum_batch_03_scenarios.py"
      - "tests/test_curriculum_batch_04_scenarios.py"
      - "tests/test_curriculum_batch_05_scenarios.py"
      - ".github/workflows/verify_curriculum_5lesson_batches.yml"
  push:
    paths:
      - "lessons/chapters/**"
      - "docs/CURRICULUM-5-LESSON-PROGRESS.json"
      - "tests/test_curriculum_structure.py"
      - "tests/test_curriculum_five_lesson_batches.py"
      - "tests/test_curriculum_batch_01_scenarios.py"
      - "tests/test_curriculum_batch_02_scenarios.py"
      - "tests/test_curriculum_batch_03_scenarios.py"
      - "tests/test_curriculum_batch_04_scenarios.py"
      - "tests/test_curriculum_batch_05_scenarios.py"
      - ".github/workflows/verify_curriculum_5lesson_batches.yml"

jobs:
  structure-and-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and Pandas for executable examples
        run: python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<4"
      - name: Check 46 chapters, MCQs, Python syntax and sequential batch ledger
        run: python -m unittest tests.test_curriculum_structure tests.test_curriculum_five_lesson_batches tests.test_curriculum_batch_01_scenarios tests.test_curriculum_batch_02_scenarios tests.test_curriculum_batch_03_scenarios tests.test_curriculum_batch_04_scenarios tests.test_curriculum_batch_05_scenarios -v
