name: Verify PythoClass lab solutions
on:
  push:
    paths:
      - 'labs/pythoclass/**'
      - '.github/workflows/verify_pythoclass_labs.yml'
  pull_request:
    paths:
      - 'labs/pythoclass/**'
      - '.github/workflows/verify_pythoclass_labs.yml'

jobs:
  verify-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install educational dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile and run the 13 curated examples
        run: python labs/pythoclass/check_examples.py
