name: Verify PythoClass Word-source labs
on:
  push:
    paths:
      - 'labs/pythoclass/**'
      - '.github/workflows/verify_pythoclass_labs.yml'
  pull_request:
    paths:
      - 'labs/pythoclass/**'
      - '.github/workflows/verify_pythoclass_labs.yml'
jobs:
  verify-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical lab dependencies
        run: python -m pip install numpy pandas scipy sympy matplotlib
      - name: Check all seven Word-linked labs
        run: python labs/pythoclass/check_labs.py
