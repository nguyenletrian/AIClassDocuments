name: PCA Pilot Validation

# Manual-only until a GitHub runner successfully reports job steps/logs.
# Initial PR validations failed before any recorded job step; do not create
# automatic failing checks on unrelated learning-material pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pca-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-pca-pilot.txt"
      - name: Install minimal PCA learning dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pca-pilot.txt
      - name: Run PCA student documentation checks
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_pca_student_v2.py' -v
