name: Verify English lab exports

on:
  push:
    paths:
      - 'docs/labs/**'
      - 'docs/LAB-EN-SOLUTIONS-*.json'
      - 'tests/test_english_lab_exports.py'
      - '.github/workflows/verify_english_lab_exports.yml'
  pull_request:
    paths:
      - 'docs/labs/**'
      - 'docs/LAB-EN-SOLUTIONS-*.json'
      - 'tests/test_english_lab_exports.py'
      - '.github/workflows/verify_english_lab_exports.yml'

jobs:
  verify-english-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical science and ML dependencies
        run: python -m pip install numpy pandas scipy sympy matplotlib scikit-learn
      - name: Check English task-and-solution exports, compile and run examples
        run: python -m unittest discover -s tests -p test_english_lab_exports.py -v
      - name: Preserve existing seven Word-derived lab solutions
        run: python labs/pythoclass/check_labs.py
